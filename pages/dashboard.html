
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>StudySync Dashboard</title>
        <link rel="stylesheet" href="../styles/dashboard.css">
        <script src="../scripts/dashboard.js" type="module" defer></script>
    </head>

    <body>
        <!-- Navigation to StudySync pages -->
        <header class="topbar">
            <a class="brand" href="dashboard.html">StudySync</a>
            <nav aria-label="Main navigation">
                <a href="dashboard.html" aria-current="page">Dashboard</a>
                <a href="schedule.html">Schedule</a>
                <a href="course.html">Courses</a>
                <a href="login.html">Sign in</a>
            </nav>
        </header>
        
        <main class="layout">
            <h1>Dashboard</h1>

            <div class="dashboard-container">
                <div class="deadline-container">
                    <h2>Upcoming Deadlines</h2>

                    <table id="assignment-table"></table>

                    <p class="notice" id="assignment-notice">No assignments added.</p>

                    <a href="course.html" class="dashboard-edit">View and Edit Assignments</a>
                </div>

                <div class="study-session-container">
                    <h2>Study Sessions</h2>

                    <table id="study-session-table">
                        <tr>
                            <th>Study Session</th>
                            <th>Priority</th>
                            <th>Time Frame</th>
                            <th>Course</th>
                        </tr>
                    </table>
 
                    <p class="notice" id="study-session-notice">No study sessions added.</p>

                    <a href="schedule.html" class="dashboard-edit">View and Edit Study Sessions</a>
                </div>

                <div class="course-container">
                    <h2>Courses</h2>

                    <div class="dashboard-course-grid"></div>

                    <p class="notice" id="course-notice">No Courses added.</p>

                    <a href="course.html" class="dashboard-edit">View and Edit Courses</a>
                </div>
            </div>
        </main>
        
    </body>
</html>
