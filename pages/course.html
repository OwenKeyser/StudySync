<!DOCTYPE html>
<html>
    <head>
        <title>StudySync Courses</title>
        <link rel="stylesheet" href="../styles/course.css">
        <script src="../scripts/course.js" defer></script>
    </head>

    <body>
        <header class="topbar">
            <a class="brand" href="dashboard.html">StudySync</a>
            <nav aria-label="Main navigation">
                <a href="dashboard.html">Dashboard</a>
                <a href="schedule.html">Schedule</a>
                <a href="course.html" aria-current="page">Courses</a>
                <a href="login.html">Sign in</a>
            </nav>
        </header>

        <main class="layout">
            <h1>Courses</h1>

            <div class="panel">
                <form id="course-form">
                    <label>Course Title<input id="course-title" name="title" maxlength="50" placeholder="e.g., CPSC 349" required></label>
                    <label>Meeting Day(s)<select id="course-meeting-days" name="meeting-days" required>
                        <option disabled selected value>-- select an option --</option>
                        <option value="M">Monday</option>
                        <option value="T">Tuesday</option>
                        <option value="W">Wednesday</option>
                        <option value="Th">Thursday</option>
                        <option value="F">Friday</option>
                        <option value="Sat">Saturday</option>
                        <option value="M/W">Monday/Wednesday</option>
                        <option value="T/Th">Tuesday/Thursday</option>
                    </select></label>
                    <label>Meeting Start Time<input id="course-meating-time-start" name="time-start" type="time" placeholder="Start time" required></label>
                    <label>Meeting End Time<input id="course-meating-time-end" name="time-end" type="time" placeholder="End time" required></label>
                    <label>Grade<input id="course-grade" name="grade" type="number" step="0.01" min="0" max="100" placeholder="e.g. 90.0" required></label>
                    <button type="submit">Add course</button>
                </form>
                <p id="form-message" role="status" aria-live="polite"></p>
            </div>

            <div class="course-grid" id="course-grid"></div>
        </main>
    </body>
</html>
