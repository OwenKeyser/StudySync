<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Schedule | StudySync</title>
  <link rel="stylesheet" href="schedule.css">
  <script src="schedule.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="dashboard.html">StudySync</a>
    <nav aria-label="Main navigation">
      <a href="dashboard.html">Dashboard</a>
      <a href="schedule.html" aria-current="page">Schedule</a>
      <a href="login.html">Sign in</a>
    </nav>
  </header>
  <main class="layout">
    <section class="heading">
      <div><h1>Study Schedule</h1><p>Plan study sessions and keep track of your week.</p></div>
      <div class="week-controls"><button id="prev-week" type="button" aria-label="Previous week">←</button><button id="today" type="button">Today</button><button id="next-week" type="button" aria-label="Next week">→</button></div>
    </section>
    <h2 id="week-label" aria-live="polite"></h2>
    <section class="calendar" id="calendar" aria-label="Weekly study schedule"></section>
    <section class="panel">
      <h2>Add a study session</h2>
      <form id="session-form">
        <label>Session title<input id="session-title" name="title" maxlength="80" placeholder="e.g., Review lecture notes" required></label>
        <label>Course<input id="session-course" name="course" maxlength="50" placeholder="e.g., CPSC 349" required></label>
        <label>Date<input id="session-date" name="date" type="date" required></label>
        <label>Start time<input id="session-time" name="time" type="time" required></label>
        <label>Duration (minutes)<input id="session-duration" name="duration" type="number" min="5" max="480" step="5" value="30" required></label>
        <button type="submit">Add session</button>
      </form>
      <p id="form-message" role="status" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
